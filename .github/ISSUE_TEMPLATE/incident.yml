name: "인시던트"
description: "시스템 장애, 서비스 중단, 긴급 상황 보고"
title: "[Incident] "
labels: ["type/incident", "priority/P0-critical", "team/operations"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 인시던트의 심각도를 선택하세요
      options:
        - P0 - 전체 서비스 다운
        - P1 - 다중 테넌트 영향
        - P2 - 단일 테넌트 영향
        - P3 - 성능 저하
    validations:
      required: true

  - type: input
    id: affected-tenants
    attributes:
      label: 영향 테넌트 수
      description: 영향을 받는 테넌트 수를 입력하세요
      placeholder: "예: 5개 테넌트"
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: 증상
      description: 발생한 증상을 명확하게 설명해주세요
      placeholder: |
        ## 발견 방법
        - 모니터링 알림
        - 고객 리포트
        - 정기 점검

        ## 관찰된 증상
        무엇이 정상적으로 작동하지 않나요?

        ## 영향받는 기능
        -

        ## 에러 메시지/로그
        ```
        에러 로그를 여기에
        ```
    validations:
      required: true

  - type: textarea
    id: auto-recovery
    attributes:
      label: 자동 복구 시도 결과
      description: 시스템이 자동으로 시도한 복구 절차와 결과를 기술해주세요
      placeholder: |
        ## 1차 자동 복구 시도
        - 시도한 작업:
        - 결과:
        - 시간:

        ## 2차 자동 복구 시도
        - 시도한 작업:
        - 결과:
        - 시간:

        ## 3차 자동 복구 시도
        - 시도한 작업:
        - 결과:
        - 시간:

        ## 최종 상태
        현재 자동 복구 상태:
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: 타임라인
      description: 인시던트 발생부터 현재까지의 타임라인을 기록해주세요
      placeholder: |
        - [HH:MM] 인시던트 발생
        - [HH:MM] 모니터링 감지/고객 리포트
        - [HH:MM] 1차 복구 시도
        - [HH:MM] 2차 복구 시도
        - [HH:MM] Human Gate 에스컬레이션
        - [HH:MM] (진행 중...)
    validations:
      required: true

  - type: textarea
    id: business-impact
    attributes:
      label: 비즈니스 영향
      description: 이 인시던트가 비즈니스에 미치는 영향을 평가해주세요
      placeholder: |
        ## 고객 영향
        - 영향받는 고객 수:
        - 비즈니스 기능 중단:
        - 고객 리포트 건수:

        ## 재무 영향
        - 예상 매출 손실:
        - SLA 위반 여부:
        - 보상 필요 여부:

        ## 평판 영향
        - 공개적 가시성:
        - 소셜 미디어 언급:
        - 언론 보도 가능성:
    validations:
      required: true

  - type: textarea
    id: immediate-actions
    attributes:
      label: 즉각 조치 필요 사항
      description: 지금 당장 수행해야 하는 조치를 나열해주세요
      placeholder: |
        - [ ] 조치 1 (담당: , 기한: )
        - [ ] 조치 2 (담당: , 기한: )
        - [ ] 조치 3 (담당: , 기한: )
    validations:
      required: false

  - type: textarea
    id: communication
    attributes:
      label: 커뮤니케이션 계획
      description: 고객/이해관계자 대상 커뮤니케이션 계획을 작성해주세요
      placeholder: |
        ## 내부 커뮤니케이션
        - 알림 대상 팀:
        - 알림 방법:

        ## 고객 커뮤니케이션
        - 알림 필요 여부: [예/아니오]
        - 알림 채널:
        - 메시지 초안:
    validations:
      required: false
