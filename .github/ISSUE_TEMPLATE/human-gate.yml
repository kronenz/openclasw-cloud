name: "Human Gate 요청"
description: "Operator 승인이 필요한 의사결정 항목"
title: "[Human Gate] "
labels: ["type/human-gate", "status/needs-human"]
body:
  - type: dropdown
    id: approval-type
    attributes:
      label: 승인 유형
      description: 어떤 종류의 승인이 필요한가요?
      options:
        - 가격/할인 승인
        - 계약 조건 변경
        - 커스텀 도메인
        - 리소스 한도 초과
        - 인프라 변경
        - 보안 검토
        - 데이터 손실 위험
        - 예산 초과
        - 장애 에스컬레이션
        - 고객 특별 오퍼
        - 기타
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: 긴급도
      description: 얼마나 빨리 승인이 필요한가요?
      options:
        - 즉시 (1시간 이내)
        - 24시간 이내
        - 주간 (2-3일)
    validations:
      required: true

  - type: dropdown
    id: requesting-team
    attributes:
      label: 요청 팀
      description: 승인을 요청하는 팀을 선택하세요
      options:
        - sales
        - onboarding
        - persona
        - integration
        - skill-dev
        - platform
        - operations
        - customer-success
    validations:
      required: true

  - type: textarea
    id: situation
    attributes:
      label: 상황 설명
      description: 현재 상황과 왜 Human Gate가 필요한지 설명해주세요
      placeholder: |
        ## 현재 상황
        무슨 일이 발생했나요?

        ## 배경 정보
        관련 고객/테넌트:
        발생 시점:
        현재 상태:

        ## 승인 필요 이유
        왜 자동 처리가 불가능한가요?
        어떤 리스크/영향이 있나요?
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 선택지
      description: 가능한 선택지와 각각의 장단점을 제시해주세요
      placeholder: |
        ## 옵션 A:
        **내용:**

        **장점:**
        -

        **단점:**
        -

        **예상 영향:**
        -

        ---

        ## 옵션 B:
        **내용:**

        **장점:**
        -

        **단점:**
        -

        **예상 영향:**
        -

        ---

        ## 옵션 C (선택사항):
        **내용:**
    validations:
      required: true

  - type: textarea
    id: ai-recommendation
    attributes:
      label: AI 에이전트 추천
      description: AI 에이전트가 분석한 추천 사항이 있다면 기술해주세요
      placeholder: |
        AI 분석 결과:

        추천 옵션: [A/B/C]

        추천 이유:
        -

        주의사항:
        -
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 컨텍스트
      description: Operator가 의사결정에 참고할 만한 추가 정보를 제공해주세요
      placeholder: |
        관련 문서:
        -

        과거 유사 사례:
        -

        기타 참고사항:
        -
    validations:
      required: false
