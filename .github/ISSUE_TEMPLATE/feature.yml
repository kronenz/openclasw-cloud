name: "기능 요청"
description: "새로운 기능이나 개선 사항 요청"
title: "[Feature] "
labels: ["type/feature", "status/needs-triage"]
body:
  - type: dropdown
    id: team
    attributes:
      label: 담당 팀
      description: 이 기능을 담당하는 팀을 선택하세요
      options:
        - sales
        - onboarding
        - persona
        - integration
        - skill-dev
        - platform
        - operations
        - customer-success
    validations:
      required: true

  - type: dropdown
    id: pipeline
    attributes:
      label: 관련 파이프라인
      description: 이 기능과 관련된 파이프라인을 선택하세요
      options:
        - customer-acquisition
        - tenant-provisioning
        - persona-crafting
        - integration-setup
        - operations
        - incident-response
        - skill-development
        - customer-success
        - N/A
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 대상 Phase
      description: 이 기능의 목표 Phase를 선택하세요
      options:
        - Phase 1
        - Phase 2
        - Phase 3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 요청하는 기능에 대해 상세히 설명해주세요
      placeholder: |
        ## 개요
        어떤 기능인가요?

        ## 배경
        왜 이 기능이 필요한가요?

        ## 기대 효과
        이 기능으로 무엇을 달성할 수 있나요?
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: 사용자 스토리
      description: 사용자 관점에서 기능을 설명해주세요
      placeholder: |
        **~로서 (As a):**
        예: 테넌트 관리자로서

        **~을 원합니다 (I want):**
        예: 페르소나 설정을 쉽게 수정하고 싶습니다

        **왜냐하면 ~이기 때문입니다 (So that):**
        예: 비즈니스 요구사항 변경에 빠르게 대응할 수 있기 때문입니다
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 이 기능이 완료되었다고 판단할 수 있는 조건을 체크리스트로 작성해주세요
      placeholder: |
        - [ ] 사용자가 X를 할 수 있다
        - [ ] Y 기능이 정상 작동한다
        - [ ] Z 데이터가 올바르게 저장된다
        - [ ] 에러 처리가 구현되어 있다
        - [ ] 테스트가 통과한다
        - [ ] 문서가 업데이트되어 있다
    validations:
      required: true

  - type: textarea
    id: technical-considerations
    attributes:
      label: 기술적 고려사항
      description: 구현 시 고려해야 할 기술적 사항을 기술해주세요 (선택사항)
      placeholder: |
        ## API 변경 사항
        -

        ## 데이터베이스 스키마
        -

        ## 외부 서비스 연동
        -

        ## 성능 요구사항
        -

        ## 보안 고려사항
        -

        ## 호환성
        -
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: 화면 설계/목업
      description: UI가 포함된 기능이라면 화면 설계나 목업을 첨부해주세요 (선택사항)
      placeholder: |
        화면 설계 설명:

        (이미지를 드래그 앤 드롭하세요)
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: 의존성
      description: 이 기능이 의존하는 다른 이슈나 작업이 있다면 기술해주세요
      placeholder: |
        선행 작업:
        - #이슈번호

        연관 기능:
        - #이슈번호
    validations:
      required: false
