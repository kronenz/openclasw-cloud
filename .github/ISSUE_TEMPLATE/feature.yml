name: Feature
description: 기능 개발 요청 (Epic 또는 Task)
labels: ["type/feature"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 범위
      options:
        - Epic (여러 Task로 분해 필요)
        - Task (단일 PR로 완료 가능)
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 예상 크기
      options:
        - XS (단일 파일, ~30분)
        - S (기존 모듈 추가, ~2시간)
        - M (새 모듈 + 테스트, ~반나절)
        - L (다수 모듈, ~1일)
        - XL (아키텍처 변경, ~2-3일)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 구현할 내용을 명확하게 기술
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 이 기능이 완료되었다고 판단할 수 있는 조건
      value: |
        - [ ] 구현 완료
        - [ ] 테스트 작성 및 통과
        - [ ] CI 통과
        - [ ] PR 리뷰 승인
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 하위 Task (Epic인 경우)
      description: Epic인 경우 분해된 Task 목록
      placeholder: |
        - [ ] #이슈번호 Task 1 설명
        - [ ] #이슈번호 Task 2 설명
