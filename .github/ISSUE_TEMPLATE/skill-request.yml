name: "스킬 개발 요청"
description: "새로운 AI 스킬 개발 및 개선 요청"
title: "[Skill] "
labels: ["type/feature", "team/skill-dev", "pipeline/skill-development"]
body:
  - type: input
    id: skill-name
    attributes:
      label: 스킬 이름
      description: 개발하려는 스킬의 이름을 입력하세요
      placeholder: "예: 예약 관리 스킬"
    validations:
      required: true

  - type: dropdown
    id: industry
    attributes:
      label: 대상 업종
      description: 이 스킬이 주로 사용될 업종을 선택하세요
      options:
        - 공통 (모든 업종)
        - 카페
        - 음식점
        - 쇼핑몰
        - 부동산
        - 병원
        - 사무실
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 스킬 설명
      description: 이 스킬이 무엇을 하는지, 어떤 문제를 해결하는지 설명해주세요
      placeholder: |
        ## 스킬 개요
        무엇을 하는 스킬인가요?

        ## 해결하는 문제
        어떤 고객 문제를 해결하나요?

        ## 주요 기능
        - 기능 1
        - 기능 2
        - 기능 3

        ## 사용 시나리오
        고객이 "XXX"라고 물어보면, 이 스킬이 "YYY"를 수행합니다.
    validations:
      required: true

  - type: textarea
    id: integrations
    attributes:
      label: 연동 서비스
      description: 필요한 외부 API나 서비스를 나열해주세요
      placeholder: |
        ## 외부 API
        - API 이름: (예: 네이버 예약 API)
          - 용도:
          - API 문서:
          - 인증 방식:

        ## 내부 서비스
        - 서비스 이름:
          - 연동 내용:

        ## 데이터베이스
        - 필요한 데이터:
          - 스키마 요구사항:
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 대상 Phase
      description: 이 스킬을 언제까지 개발할 것인가요?
      options:
        - Phase 1
        - Phase 2
        - Phase 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 스킬 개발의 우선순위를 선택하세요
      options:
        - P0 - 최우선 (즉시 처리)
        - P1 - 높음 (24시간 이내)
        - P2 - 중간 (주간 내)
        - P3 - 낮음 (계획 단계)
    validations:
      required: true

  - type: textarea
    id: conversation-examples
    attributes:
      label: 대화 예시
      description: 고객과 AI의 대화 예시를 작성해주세요
      placeholder: |
        ## 예시 1
        **고객:** "내일 2시에 예약 가능해?"
        **AI (이 스킬 사용):** "네, 내일 2시에 예약 가능합니다. 예약하시겠습니까?"

        ## 예시 2
        **고객:** "예약 확인 부탁해"
        **AI (이 스킬 사용):** "홍길동님, 1월 15일 오후 2시에 예약되어 있습니다."

        ## 예시 3
        **고객:** (다른 시나리오)
        **AI (이 스킬 사용):**
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 이 스킬이 완료되었다고 판단할 수 있는 조건을 체크리스트로 작성해주세요
      placeholder: |
        - [ ] 스킬이 정확하게 트리거된다
        - [ ] 외부 API 연동이 정상 작동한다
        - [ ] 에러 상황을 적절히 처리한다
        - [ ] 대화 흐름이 자연스럽다
        - [ ] 테스트 케이스가 통과한다
        - [ ] 페르소나 설정에 추가되어 있다
        - [ ] 문서가 작성되어 있다
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: 기술적 참고사항
      description: 개발 시 참고할 기술적 사항을 기술해주세요 (선택사항)
      placeholder: |
        ## 성능 요구사항
        - 응답 시간:
        - 동시 처리:

        ## 보안 고려사항
        -

        ## 데이터 보관 정책
        -

        ## 기타
        -
    validations:
      required: false
