name: Task
description: 일반 작업 (인프라, 문서, 리팩토링 등)
labels: ["type/task"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      options:
        - Infrastructure (인프라/CI/CD)
        - Documentation (문서)
        - Refactoring (리팩토링)
        - Security (보안)
        - Performance (성능)
        - Other (기타)
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 예상 크기
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 수행할 작업을 명확하게 기술
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] 작업 완료
        - [ ] CI 통과
        - [ ] PR 리뷰 승인
