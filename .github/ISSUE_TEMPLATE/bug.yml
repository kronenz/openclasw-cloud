name: "버그 리포트"
description: "시스템 오류, 버그, 예상치 못한 동작 보고"
title: "[Bug] "
labels: ["type/bug", "status/needs-triage"]
body:
  - type: dropdown
    id: team
    attributes:
      label: 담당 팀
      description: 이 버그를 담당하는 팀을 선택하세요
      options:
        - sales
        - onboarding
        - persona
        - integration
        - skill-dev
        - platform
        - operations
        - customer-success
    validations:
      required: true

  - type: dropdown
    id: pipeline
    attributes:
      label: 관련 파이프라인
      description: 이 버그와 관련된 파이프라인을 선택하세요
      options:
        - customer-acquisition
        - tenant-provisioning
        - persona-crafting
        - integration-setup
        - operations
        - incident-response
        - skill-development
        - customer-success
        - N/A
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 버그의 심각도와 우선순위를 선택하세요
      options:
        - P0 - 최우선 (즉시 처리)
        - P1 - 높음 (24시간 이내)
        - P2 - 중간 (주간 내)
        - P3 - 낮음 (계획 단계)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발생한 버그를 명확하게 설명해주세요
      placeholder: |
        무엇이 잘못되었나요?

        언제 발생했나요?

        어떤 영향이 있나요?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계
      description: 버그를 재현할 수 있는 단계를 상세히 기술해주세요
      placeholder: |
        1. 특정 페이지로 이동
        2. 특정 액션 수행
        3. 특정 데이터 입력
        4. 버그 발생 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 정상적으로 동작했을 때 어떻게 작동해야 하나요?
      placeholder: |
        예상했던 정상 동작을 설명해주세요
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떻게 동작했나요?
      placeholder: |
        실제로 발생한 동작을 설명해주세요
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 영향 범위
      description: 이 버그가 영향을 미치는 범위를 선택하세요
      options:
        - 전체 플랫폼
        - 다중 테넌트
        - 단일 테넌트
        - 성능 저하
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그
      description: 관련된 에러 로그, 스택 트레이스, 스크린샷 등을 첨부해주세요
      placeholder: |
        ```
        에러 로그를 여기에 붙여넣으세요
        ```

        스크린샷:
        (이미지를 드래그 앤 드롭하세요)
    validations:
      required: false
