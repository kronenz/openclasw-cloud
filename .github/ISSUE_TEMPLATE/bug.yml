name: Bug Report
description: 버그 리포트
labels: ["type/bug"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0-critical (서비스 중단)
        - P1-high (주요 기능 장애)
        - P2-medium (일반 버그)
        - P3-low (사소한 문제)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 무엇이 잘못되었는지
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작해야 하는 방식
    validations:
      required: true
