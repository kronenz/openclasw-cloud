name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend - Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run schema validation tests
        run: npx vitest run --config vitest.config.node.ts

  frontend-check:
    name: Frontend - Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: platform
        run: npm ci

      - name: Lint frontend
        working-directory: platform
        run: npm run lint

      - name: Build frontend
        working-directory: platform
        run: npm run build
