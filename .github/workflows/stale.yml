name: Stale Issues Management

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 60
          stale-issue-label: 'status/stale'
          exempt-issue-labels: 'type/rfc,type/human-gate,priority/P0-critical,priority/P1-high'
          stale-issue-message: |
            이 이슈는 30일 동안 활동이 없어 자동으로 stale 상태로 표시되었습니다.

            추가 활동이 없으면 60일 후 자동으로 종료됩니다.
            이 이슈가 여전히 유효하다면 코멘트를 남겨주세요.
          close-issue-message: |
            이 이슈는 60일 동안 활동이 없어 자동으로 종료되었습니다.

            필요시 재개할 수 있습니다.
          operations-per-run: 100
