<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md mx-auto px-4">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-2xl mb-4">
        <i data-lucide="bot" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">OpenClaw Cloud</h1>
      <p class="text-sm text-gray-500 mt-1">AI Agent Operations Platform</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
      <h2 class="text-lg font-semibold text-gray-900 mb-6">Sign in to your account</h2>

      <form class="space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="email" placeholder="you@company.com" class="w-full h-10 pl-10 pr-4 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-xs text-blue-600 hover:text-blue-700">Forgot password?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="password" placeholder="Enter password" class="w-full h-10 pl-10 pr-4 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center">
          <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
          <label for="remember" class="ml-2 text-sm text-gray-600">Remember me</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full h-10 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Sign in
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
        <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-gray-400">or continue with</span></div>
      </div>

      <!-- SSO / Cloudflare Access -->
      <button class="w-full h-10 bg-white text-gray-700 text-sm font-medium border border-gray-300 rounded-md hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
        <i data-lucide="shield" class="w-4 h-4 text-orange-500"></i>
        Cloudflare Zero Trust SSO
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-400 mt-6">
      By signing in, you agree to our
      <a href="#" class="text-gray-500 hover:text-gray-700 underline">Terms</a> and
      <a href="#" class="text-gray-500 hover:text-gray-700 underline">Privacy Policy</a>
    </p>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
